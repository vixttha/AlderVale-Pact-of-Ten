<g fill="url(#green)" stroke="url(#gold)" stroke-width="3" paint-order="stroke fill">
 <text x="405" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="184" font-weight="bold" letter-spacing="-8">AlderVale</text>
