<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 512" role="img" aria-labelledby="title desc">
<title id="title">AlderVale: Pact of Ten</title><desc id="desc">Forest-green and antique-gold fantasy wordmark with a circular alder-leaf seal and central four-point star.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5dc8a"/><stop offset=".48" stop-color="#b9872d"/><stop offset="1" stop-color="#f8e6a8"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#24452a"/><stop offset="1" stop-color="#092113"/></linearGradient>
 <g id="leaf"><path d="M0 0 C-34 -28 -43 -76 0 -116 C43 -76 34 -28 0 0Z" fill="url(#green)" stroke="url(#gold)" stroke-width="7"/><path d="M0 -5 Q0 -53 0 -105 M0 -48 L-19 -68 M0 -62 L19 -81" fill="none" stroke="#9cae61" stroke-width="3" stroke-linecap="round"/></g>
