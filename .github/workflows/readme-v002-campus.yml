name: README v0.0.2 campus capture
on:
  push:
    branches: [docs/readme-v002-campus]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3fa20bc5ed4fecc228cc3733536a589bf75df6a0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Build exact verified game revision
        run: |
          test "$(git rev-parse HEAD)" = 3fa20bc5ed4fecc228cc3733536a589bf75df6a0
          git rev-parse HEAD
          bun install --frozen-lockfile
          bun run build
          npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund
      - name: Capture the Breeze campus in Chromium
        working-directory: tools/ci
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npx playwright install --with-deps chromium
          python3 - <<'PY'
          from pathlib import Path
          p = Path('human.pw.mjs')
          source = p.read_text()
          anchor = "  const starter = await readWizard();"
          assert source.count(anchor) == 1
          p.write_text(source.replace(anchor, """
            await expect(world.locator('canvas')).toBeVisible();
            await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
            await page.screenshot({ path: process.env.RUNNER_TEMP + '/breeze-campus.png', animations: 'disabled' });
          """ + anchor))
          PY
          xvfb-run --auto-servernum npm run test:browser -- --project=chromium --headed -g 'a guest wins as Rowan and keeps First Spark and its rewards after reload'
      - name: Prepare screenshot and integrity receipt
        run: |
          cd "$RUNNER_TEMP"
          python3 -m pip install --quiet --disable-pip-version-check Pillow==12.2.0
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("breeze-campus.png").convert("RGB")
          im.save("breeze-campus.webp", quality=84, method=6)
          print("Screenshot dimensions:", im.size)
          PY
          sha256sum breeze-campus.webp
          python3 - <<'PY'
          import base64
          import textwrap
          from pathlib import Path
          data = base64.b64encode(Path('breeze-campus.webp').read_bytes()).decode()
          for index, line in enumerate(textwrap.wrap(data, 768, break_on_hyphens=False)):
              print(f"SCREENSHOT_{index:03d} {line}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aldervale-readme-v002-campus
          path: |
            ${{ runner.temp }}/breeze-campus.png
            ${{ runner.temp }}/breeze-campus.webp
          retention-days: 1
          if-no-files-found: error
