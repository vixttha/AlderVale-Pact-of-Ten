name: Seed verified First Spark graph for current main

on:
  push:
    branches: [ops/graphify-hq-v0.0.7-archive]

permissions:
  contents: read
  pull-requests: read

env:
  TEMPLATE: graphify-hq/versions/v0.0.7
  TEMPLATE_SHA: 5632aec210d184552abbbc3290bc1e201f1eb9b2
  PYTHONHASHSEED: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEMPLATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Build and verify First Spark on the merged main checkout
        run: |
          test "$(git rev-parse HEAD)" = "$TEMPLATE_SHA"
          echo "FEATURE_SOURCE_CHECKOUT $TEMPLATE_SHA"
          template="$GITHUB_WORKSPACE/$TEMPLATE"
          python -m pip install --quiet --require-hashes --no-cache-dir --no-deps --only-binary=:all: -r "$template/requirements.txt"
          python -m pip check
          jq --arg source "$TEMPLATE_SHA" '.source_commit = $source | del(.pull_request)' \
            "$template/examples/first-spark.json" > "$RUNNER_TEMP/first-spark.json"
          python "$template/evidence_map.py" "$RUNNER_TEMP/first-spark.json" "$RUNNER_TEMP/feature"
          python "$template/evidence_map.py" "$RUNNER_TEMP/first-spark.json" "$RUNNER_TEMP/feature" --check
          for file in graph.json receipt.json; do
            printf 'VERIFIED_FEATURE_FILE %s ' "$file"
            base64 -w0 "$RUNNER_TEMP/feature/$file"
            printf '\n'
          done
