name: AlderVale brand asset validation
on:
  pull_request:
    paths:
      - 'art/branding/**'
      - 'tools/branding/**'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    # Uses the owner's registered self-hosted Linux runner; no paid GitHub-hosted minutes.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic rendering dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Build PNG deliverables
        run: python tools/branding/build_brand_assets.py
      - name: Validate assets
        run: python tools/branding/validate_brand_assets.py
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aldervale-brand-assets
          path: dist/branding/
          if-no-files-found: error
          retention-days: 30
