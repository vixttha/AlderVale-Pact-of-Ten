name: Public hosted runner policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require public repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_PRIVATE" != "false" ]; then
            echo "::error::AlderVale must remain public. Stop CI and seek owner approval."
            exit 1
          fi
      - name: Reject local, dynamic, and nonstandard runner labels
        run: python3 tools/ci/check_runner_policy.py
      - name: Reject slow WebKit dependency installation
        run: python3 tools/ci/check_webkit_container.py
      - name: Run Test Vault Python regressions
        run: python3 -m unittest discover -s tests/vault -p 'test_*.py' -v
