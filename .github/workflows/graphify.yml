name: AlderVale Graphify scoped transaction receipt

on:
  push:
    branches: [audit/190-late-abort-evidence]

permissions:
  contents: read

concurrency:
  group: aldervale-graphify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  receipt:
    if: github.event.repository.private == false
    name: Verify exact candidate receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check public runner policy and exact candidate receipt inputs
        run: python3 tools/ci/check_runner_policy.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c5422c097ba97ae04d00da1b743c1e49685cb470
          path: bug-library-checker
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Execute pinned Bug Library receipt checker
        run: |
          set -euo pipefail
          test "$(git -C bug-library-checker rev-parse HEAD)" = "c5422c097ba97ae04d00da1b743c1e49685cb470"
          node bug-library-checker/receipts/validate.mjs 628d070260c0f61d2508140c6a27793e4fb9e92f audit/transaction-required-checks.json audit/transaction-receipt.json
