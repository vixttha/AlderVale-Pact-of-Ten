name: AlderVale Graphify

on:
  push:
    branches: [main, AlderVale-Test-Vault]
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - '.github/workflows/graphify.yml'
      - 'tools/graphify/**'
      - 'tests/vault/bash/**'
  workflow_dispatch:
    inputs:
      publish_commit_snapshot:
        description: Store this commit graph at commits/<sha> on graphify-snapshots
        type: boolean
        default: false

permissions:
  contents: read

env:
  GRAPHIFY_SOURCE_PREFIX: ${{ (github.ref == 'refs/heads/AlderVale-Test-Vault' || github.base_ref == 'AlderVale-Test-Vault') && 'tests/vault/' || 'src/' }}

concurrency:
  group: aldervale-graphify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  graph:
    name: Audit, rebuild graph, and verify MCP
    if: github.event.repository.private == false && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      snapshot_0: ${{ steps.pack.outputs.snapshot_0 }}
      snapshot_1: ${{ steps.pack.outputs.snapshot_1 }}
      snapshot_2: ${{ steps.pack.outputs.snapshot_2 }}
      snapshot_3: ${{ steps.pack.outputs.snapshot_3 }}
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Verify Graphify publisher contracts with Bash
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'Base: %s\nHead: %s\nRun / attempt: %s / %s\n' "${PR_BASE_SHA:-n/a}" "${PR_HEAD_SHA:-n/a}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
          bash tests/vault/bash/graphify-publish-contracts.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install locked Graphify and MCP packages
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps -r tools/graphify/requirements.txt
      - name: Audit Graphify and list retained versions
        run: |
          python tools/graphify/audit_cli.py | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '### Retained versions before this run'
            echo 'Semver tags:'
            git ls-remote --tags origin 'refs/tags/v*' || true
            echo
            echo 'graphify-snapshots:'
            git ls-remote origin refs/heads/graphify-snapshots || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the graph and query it over MCP
        run: |
          graphify extract . --code-only --max-workers 2 --out "$RUNNER_TEMP/aldervale"
          python tools/graphify/snapshot.py "$RUNNER_TEMP/aldervale/graphify-out/graph.json"
          cat "$RUNNER_TEMP/aldervale/graphify-out/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify copy and query against a local Git remote
        run: bash tools/graphify/check-publish.sh "$RUNNER_TEMP/aldervale/graphify-out"
      - name: Pack verified graph for the next job
        id: pack
        run: python tools/graphify/transfer.py pack "$RUNNER_TEMP/aldervale/graphify-out"

  verify-transfer:
    name: Read the graph back over MCP
    needs: graph
    if: github.event.repository.private == false && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked Graphify and MCP packages
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps -r tools/graphify/requirements.txt
      - name: Query the transferred graph over MCP
        env:
          SNAPSHOT_0: ${{ needs.graph.outputs.snapshot_0 }}
          SNAPSHOT_1: ${{ needs.graph.outputs.snapshot_1 }}
          SNAPSHOT_2: ${{ needs.graph.outputs.snapshot_2 }}
          SNAPSHOT_3: ${{ needs.graph.outputs.snapshot_3 }}
        run: |
          python tools/graphify/transfer.py unpack "$RUNNER_TEMP/snapshot"
          python tools/graphify/mcp_readback.py "$RUNNER_TEMP/snapshot/graph.json" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/snapshot/receipt.json" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified graph to Git
    needs: [graph, verify-transfer]
    if: >-
      github.event.repository.private == false &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/AlderVale-Test-Vault' ||
        github.ref_type == 'tag' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_commit_snapshot == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore graph and receipt without storing an Actions artifact
        env:
          SNAPSHOT_0: ${{ needs.graph.outputs.snapshot_0 }}
          SNAPSHOT_1: ${{ needs.graph.outputs.snapshot_1 }}
          SNAPSHOT_2: ${{ needs.graph.outputs.snapshot_2 }}
          SNAPSHOT_3: ${{ needs.graph.outputs.snapshot_3 }}
        run: python3 tools/graphify/transfer.py unpack "$RUNNER_TEMP/snapshot"
      - name: Publish without replacing history
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPHIFY_PUBLISH_COMMIT: ${{ (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/AlderVale-Test-Vault' && github.ref_type != 'tag') && '1' || '0' }}
        run: bash tools/graphify/publish.sh "$RUNNER_TEMP/snapshot"
