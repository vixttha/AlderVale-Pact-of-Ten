name: Avarn v2 - guarded source intake
on:
  push:
    branches: [avarn-3d-development]
permissions:
  contents: read
concurrency:
  group: avarn-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact checkout and inventory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/validate_universe.py
      - name: Run positive and negative selection fixtures
        run: python3 -m unittest discover -s tools -p test_avarn_intake.py -v
  source-intake:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source and anatomical selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source=art/avarn/3d/source/avarn-v1.glb
          if [[ ! -f "$source" ]]; then
            echo "::error::Original Avarn v1 GLB not transferred; no actual mesh validation or repair executed."
            exit 1
          fi
          python3 tools/avarn_intake.py "$source" | tee "$RUNNER_TEMP/avarn-intake.txt"
          cat "$RUNNER_TEMP/avarn-intake.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Pin BART and Blender using existing Hearth Gate toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/vixttha/Blender-Agent-Refinement-Toolkit.git "$RUNNER_TEMP/bart"
          git -C "$RUNNER_TEMP/bart" checkout --detach 392d8d7a1c262227cba3c08d5577af38c74b4e25
          test "$(git -C "$RUNNER_TEMP/bart" rev-parse HEAD)" = "392d8d7a1c262227cba3c08d5577af38c74b4e25"
          echo "PYTHONPATH=$RUNNER_TEMP/bart/src" >> "$GITHUB_ENV"
          release=release/Blender4.5/blender-4.5.0-linux-x64.tar.xz
          curl --fail --location --connect-timeout 10 --max-time 100 --retry 2 --silent --show-error "https://download.blender.org/$release" -o "$RUNNER_TEMP/blender.tar.xz" ||
            curl --fail --location --connect-timeout 10 --max-time 100 --retry 2 --silent --show-error "https://mirror.blender.org/$release" -o "$RUNNER_TEMP/blender.tar.xz"
          printf '%s  %s\n' 1188b95cc12321c770b631939f7c25a096910b6f884a990bf9c0f62d52b38aec "$RUNNER_TEMP/blender.tar.xz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
      - name: BART inspection and independent Blender import
        shell: bash
        run: |
          set -euo pipefail
          source=art/avarn/3d/source/avarn-v1.glb
          python -m blender_agent version
          python -m blender_agent --workspace "$GITHUB_WORKSPACE" --blender "$BLENDER_BIN" --timeout 180 inspect "$source"
          "$BLENDER_BIN" --background --factory-startup --disable-autoexec --python-exit-code 1 --python-expr 'import bpy, sys; bpy.ops.wm.read_factory_settings(use_empty=True); bpy.ops.import_scene.gltf(filepath=sys.argv[-1]); meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]; assert len(meshes)==1; assert not any(o.type=="ARMATURE" for o in bpy.context.scene.objects); meshes[0].data.calc_loop_triangles(); assert len(meshes[0].data.loop_triangles)==492321; print("Independent Blender import: 492321 triangles, static mesh")' -- "$GITHUB_WORKSPACE/$source"
          printf '%s  %s\n' 0595f7991c0f1ce63c9e83f33d06581e452d7d06f61f2c78b51403151f8d2779 "$source" | sha256sum --check -
          echo "Original source unchanged. No geometry surgery or model acceptance performed."
