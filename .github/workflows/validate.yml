name: AlderVale validation

on:
  push:
    branches: [main, 'codex/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aldervale-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Public runs use standard free hosted runners.
    if: github.event.repository.private == false
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record tested checkout
        id: checkout_revision
        shell: bash
        run: |
          tested_sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$tested_sha" >> "$GITHUB_OUTPUT"
      - id: evidence_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Rules lint
        run: bun run lint:rules
      - name: Unit and structural tests
        id: unit_test
        run: bun run test
      - name: Rowan model provenance and rig contract
        run: node scripts/validate-human-model.mjs
      - name: Build production client
        run: bun run build
      - name: Real HTTP and WebSocket integration
        id: server_test
        run: node --test tools/ci/server.check.mjs
      - name: Install and start the Windows owner-play build
        if: runner.os == 'Windows'
        run: '& ".\AlderVale Play\Play AlderVale.cmd" --smoke --checkout'
      - name: Asset sizes and GLB integrity
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/asset-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Validate standalone agent packages without model calls
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for package in agents/aldervale-loop agents/aldervale-v002; do
            npm ci --prefix "$package" --ignore-scripts --no-audit --no-fund
            npm run check --prefix "$package"
          done
          npm test --prefix agents/aldervale-v002

      - name: Write verification summary
        if: ${{ always() && steps.evidence_node.outcome == 'success' }}
        env:
          TESTED_SHA: ${{ steps.checkout_revision.outputs.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UNIT_OUTCOME: ${{ steps.unit_test.outcome }}
          SERVER_OUTCOME: ${{ steps.server_test.outcome }}
        run: node tools/ci/verification-summary.mjs

  browser:
    if: github.event.repository.private == false
    name: Guest browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record tested checkout
        id: checkout_revision
        shell: bash
        run: |
          tested_sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$tested_sha" >> "$GITHUB_OUTPUT"
      - id: evidence_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install isolated validation tools
        run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        working-directory: tools/ci
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test local guest flows without production Firebase
        id: browser_test
        working-directory: tools/ci
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/playwright-evidence.json
        run: xvfb-run --auto-servernum npm run test:browser -- --project=${{ matrix.browser }} --headed --reporter=list,html,json
      - name: Write verification summary
        if: ${{ always() && steps.evidence_node.outcome == 'success' }}
        env:
          TESTED_SHA: ${{ steps.checkout_revision.outputs.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BROWSER_OUTCOME: ${{ steps.browser_test.outcome }}
          PLAYWRIGHT_EVIDENCE: ${{ runner.temp }}/playwright-evidence.json
        run: node tools/ci/verification-summary.mjs
      - name: Retain failure evidence briefly
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            tools/ci/playwright-report/
            tools/ci/test-results/
          retention-days: 1
          if-no-files-found: ignore

  firestore:
    if: github.event.repository.private == false
    name: Firestore emulator permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record tested checkout
        id: checkout_revision
        shell: bash
        run: |
          tested_sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$tested_sha" >> "$GITHUB_OUTPUT"
      - id: evidence_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Test rules, transactions, matchmaking, and signed-in progression in a demo project
        id: firestore_test
        env:
          GOOGLE_CLOUD_PROJECT: demo-aldervale-ci
          FIRESTORE_DATABASE_ID: '(default)'
        run: >-
          tools/ci/node_modules/.bin/firebase emulators:exec
          --config firebase.ci.json --project demo-aldervale-ci --only auth,firestore
          "node --test tools/ci/firestore.check.mjs && npm test -- tests/firestore.integration.test.ts && node --test tools/ci/authenticated-matchmaking.check.mjs && node --test tools/ci/authenticated-progression.check.mjs"
      - name: Write verification summary
        if: ${{ always() && steps.evidence_node.outcome == 'success' }}
        env:
          TESTED_SHA: ${{ steps.checkout_revision.outputs.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FIRESTORE_OUTCOME: ${{ steps.firestore_test.outcome }}
        run: node tools/ci/verification-summary.mjs
