name: AlderVale validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aldervale-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Public runs use standard free hosted runners. Private runs require a manual dispatch.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Rules lint
        run: bun run lint:rules
      - name: Unit and structural tests
        run: bun run test
      - name: Rowan model provenance and rig contract
        run: node scripts/validate-human-model.mjs
      - name: Build production client
        run: bun run build
      - name: Real HTTP and WebSocket integration
        run: node --test tools/ci/server.check.mjs
      - name: Asset sizes and GLB integrity
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/asset-report.mjs >> "$GITHUB_STEP_SUMMARY"

  browser:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    name: Guest browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install isolated validation tools
        run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        working-directory: tools/ci
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test local guest flows without production Firebase
        working-directory: tools/ci
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum npm run test:browser -- --project=${{ matrix.browser }} --headed
      - name: Retain failure evidence briefly
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            tools/ci/playwright-report/
            tools/ci/test-results/
          retention-days: 1
          if-no-files-found: ignore

  firestore:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    name: Firestore emulator permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund
      - name: Test actual rules using a demo project
        working-directory: tools/ci
        run: npm run test:rules
