name: Bug Library live claim verification
on:
  push:
    branches: [ci/bug-library-live-claim]
permissions:
  contents: read
jobs:
  live-claim:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Record tested checkout
        run: git rev-parse HEAD
      - name: Verify claim creation, stale lease and cleanup
        env:
          CLAIM_TEST_TOKEN: ${{ github.token }}
        run: node --test tests/liveClaim.check.mjs
