name: Test Vault template verification

on:
  push:
    branches: [Test-Vault]
  pull_request:
    branches: [Test-Vault]

permissions:
  contents: read

concurrency:
  group: test-vault-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maps:
    name: Rebuild and verify version maps
    if: github.event.repository.private == false && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked Graphify and MCP packages
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps -r tools/graphify/requirements.txt
      - name: Verify archive provenance and committed maps
        shell: bash
        run: |
          set -o pipefail
          printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python tools/graphify/version_maps.py "$RUNNER_TEMP/test-vault-maps" --check --export-missing |
            tee >(sed '/^TEST_VAULT_MAP_EXPORT /d' >> "$GITHUB_STEP_SUMMARY")

  adoption:
    name: Adopt starter (${{ matrix.fixture }})
    if: github.event.repository.private == false && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        fixture: [python-cli, go-api, docs-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.fixture == 'go-api'
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify adoption
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -o pipefail
          {
            printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)"
            python tools/verify_adoption.py --fixture "$FIXTURE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
