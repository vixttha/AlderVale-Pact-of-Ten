name: Provenistem isolated adoption
on:
  push:
    branches: [Provenistem]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 tools/library.py check
          package=$(mktemp -d)
          git archive HEAD -- LIBRARY-AGENT-GUIDE.md LICENSE README.md docs features ideas templates tests tools | tar -x -C "$package"
          (cd "$package" && python3 -m unittest discover -s tests -v)
