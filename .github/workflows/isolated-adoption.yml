name: Veraphify isolated runtime
on:
  push:
    branches: [Veraphify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          set -euo pipefail
          git rev-parse HEAD
          node --check veraphifiy.mjs
          node veraphifiy.mjs --help
          node --input-type=module -e 'import { sha256 } from "./test-vault/javascript/inspect-evidence.mjs"; if (sha256(Buffer.from("abc")) !== "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad") process.exit(1)'
