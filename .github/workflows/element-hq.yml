name: Element HQ documents

on:
  push:
    branches: [element-hq-v1, aldervale-element-design-v1]

permissions:
  contents: read

concurrency:
  group: element-hq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Verify Element HQ checkout
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check branch contents, template, and design
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          head = git("rev-parse", "HEAD").strip()
          if head != os.environ["GITHUB_SHA"]:
              raise SystemExit(f"Unexpected checkout: {head}")

          workflow = ".github/workflows/element-hq.yml"
          template = "element-hq/templates/element-design.md"
          design = "element-hq/designs/aldervale-element-system-v1.md"
          documents = {
              "element-hq/README.md",
              "element-hq/element-registry.md",
              "element-hq/fusion-system-v1.md",
              template,
              design,
          }
          tracked = set(git("ls-files", "-z").rstrip("\0").split("\0"))
          missing = (documents | {"README.md", workflow}) - tracked
          unexpected = {
              path for path in tracked
              if path not in {"README.md", workflow}
              and (not path.startswith("element-hq/") or not path.endswith(".md")
                   or not Path(path).is_file() or Path(path).is_symlink())
          }
          if missing or unexpected:
              raise SystemExit(f"Missing: {sorted(missing)}; unexpected: {sorted(unexpected)}")

          guide = Path("README.md").read_text(encoding="utf-8")
          for path in sorted(documents):
              if f"]({path})" not in guide:
                  raise SystemExit(f"Branch guide is missing its link to {path}")

          sections = {
              "## Identity and lore",
              "## Current mechanics and sources",
              "## Proposed mechanics",
              "## Creatures and fusion lineage",
              "## Balance and verification",
              "## Open questions and decisions",
          }
          for path in (template, design):
              headings = set(Path(path).read_text(encoding="utf-8").splitlines())
              if missing_sections := sections - headings:
                  raise SystemExit(f"{path} is missing sections: {sorted(missing_sections)}")

          if os.environ["GITHUB_REF"] == "refs/heads/aldervale-element-design-v1":
              biology_headings = {
                  "## 4. Creature biology",
                  "### Can two different elements produce offspring?",
                  "### Can creatures have two elemental affinities?",
                  "### Can an element change during evolution?",
                  "### Are some elements genetically rare?",
                  "### Can creatures resist their natural elemental instincts?",
              }
              design_headings = set(Path(design).read_text(encoding="utf-8").splitlines())
              if missing_biology := biology_headings - design_headings:
                  raise SystemExit(f"Missing creature biology sections: {sorted(missing_biology)}")

              mythology_headings = {
                  "## 5. Elemental mythology",
                  "### Where did the elements originate?",
                  "### Why are there five opposing pairs?",
                  "### Are the elements conscious?",
                  "### Can they manifest physically?",
                  "### What is the relationship between Space and Time?",
              }
              if missing_mythology := mythology_headings - design_headings:
                  raise SystemExit(f"Missing elemental mythology sections: {sorted(missing_mythology)}")

              design_lines = Path(design).read_text(encoding="utf-8").splitlines()
              visual_headings = {
                  "## 6. Elemental visual identity",
                  "### Palette, emblem, and UI icon",
                  "### Magic, creatures, and environments",
                  "### Readability and art review",
              }
              if missing_visual := visual_headings - design_headings:
                  raise SystemExit(f"Missing elemental visual sections: {sorted(missing_visual)}")

              visual_start = design_lines.index("## 6. Elemental visual identity")
              visual_end = design_lines.index("## Balance and verification", visual_start + 1)
              visual_lines = design_lines[visual_start:visual_end]
              palette_start = visual_lines.index("### Palette, emblem, and UI icon")
              art_start = visual_lines.index("### Magic, creatures, and environments")
              review_start = visual_lines.index("### Readability and art review")
              expected_elements = {
                  "Ember", "Frost", "Gale", "Bramble", "Tide", "Spark", "Umbra", "Sol",
                  "Verdigris", "Chronos", "Magma", "Tempest", "Glacier", "Eclipse", "Aetheris",
              }
              for start, end, columns in ((palette_start, art_start, 6), (art_start, review_start, 4)):
                  table = [line for line in visual_lines[start:end] if line.startswith("| ")][2:]
                  cells = [[cell.strip() for cell in line.strip("|").split("|")] for line in table]
                  if (len(cells) != len(expected_elements)
                          or {row[0] for row in cells} != expected_elements
                          or any(len(row) != columns or not all(row) for row in cells)):
                      raise SystemExit("Elemental visual table must cover each catalog element once with complete cells")

          print(f"Verified Element HQ documents at {head}")
          PY
