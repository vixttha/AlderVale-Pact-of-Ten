name: Element HQ documents

on:
  push:
    branches: [element-hq-v1, aldervale-element-design-v1]

permissions:
  contents: read

concurrency:
  group: element-hq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Verify Element HQ checkout
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check branch contents, template, and design
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          head = git("rev-parse", "HEAD").strip()
          if head != os.environ["GITHUB_SHA"]:
              raise SystemExit(f"Unexpected checkout: {head}")

          workflow = ".github/workflows/element-hq.yml"
          template = "element-hq/templates/element-design.md"
          design = "element-hq/designs/aldervale-element-system-v1.md"
          documents = {
              "element-hq/README.md",
              "element-hq/element-registry.md",
              "element-hq/fusion-system-v1.md",
              template,
              design,
          }
          tracked = set(git("ls-files", "-z").rstrip("\0").split("\0"))
          missing = (documents | {"README.md", workflow}) - tracked
          unexpected = {
              path for path in tracked
              if path not in {"README.md", workflow}
              and (not path.startswith("element-hq/") or not path.endswith(".md")
                   or not Path(path).is_file() or Path(path).is_symlink())
          }
          if missing or unexpected:
              raise SystemExit(f"Missing: {sorted(missing)}; unexpected: {sorted(unexpected)}")

          guide = Path("README.md").read_text(encoding="utf-8")
          for path in sorted(documents):
              if f"]({path})" not in guide:
                  raise SystemExit(f"Branch guide is missing its link to {path}")

          sections = {
              "## Identity and lore",
              "## Current mechanics and sources",
              "## Proposed mechanics",
              "## Creatures and fusion lineage",
              "## Balance and verification",
              "## Open questions and decisions",
          }
          rebuilt_design_branch = os.environ["GITHUB_REF"] == "refs/heads/aldervale-element-design-v1"
          for path in (template, design):
              required = sections
              if path == design and rebuilt_design_branch:
                  required = (sections - {"## Proposed mechanics", "## Creatures and fusion lineage"}) | {
                      "### Proposed mechanics", "### Creatures and fusion lineage",
                  }
              headings = set(Path(path).read_text(encoding="utf-8").splitlines())
              if missing_sections := required - headings:
                  raise SystemExit(f"{path} is missing sections: {sorted(missing_sections)}")

          if rebuilt_design_branch:
              status = "element-hq/designs/aldervale-element-design-status.md"
              if status not in tracked or f"]({status})" not in guide:
                  raise SystemExit(f"Branch guide must link to the tracked {status}")

              design_text = Path(design).read_text(encoding="utf-8")
              status_text = Path(status).read_text(encoding="utf-8")
              steps = (
                  "Element roster", "Combat and spells", "Fusion recipes", "Creature biology",
                  "Elemental mythology", "Elemental visual identity", "Elemental world map",
                  "Existing game compatibility",
              )
              for number, step in enumerate(steps, 1):
                  heading = f"## {number}. {step}"
                  if design_text.splitlines().count(heading) != 1:
                      raise SystemExit(f"Expected one design section {heading}")
                  anchor = f"#{number}-{step.lower().replace(' ', '-')}"
                  if f"aldervale-element-system-v1.md{anchor})" not in status_text:
                      raise SystemExit(f"Missing status index link to {heading}")

              def rows_between(start_heading, end_heading, columns):
                  after_start = design_text.split(start_heading + "\n", 1)
                  if len(after_start) != 2 or end_heading + "\n" not in after_start[1]:
                      raise SystemExit(f"Missing section bounds for {start_heading}")
                  body = after_start[1].split(end_heading + "\n", 1)[0]
                  lines = [line for line in body.splitlines() if line.startswith("| ")][2:]
                  rows = [[value.strip() for value in line.strip("|").split("|")] for line in lines]
                  if not rows or any(len(row) != columns or not all(row) for row in rows):
                      raise SystemExit(f"Invalid table under {start_heading}")
                  return rows

              pairs = (
                  ("Fire", "Water"), ("Lightning", "Frost"), ("Wind", "Earth"),
                  ("Light", "Dark"), ("Metal", "Forest"),
              )
              opposition = {element: other for a, b in pairs for element, other in ((a, b), (b, a))}
              pair_rows = rows_between("## v1 elemental opposition decision", "## 1. Element roster", 3)
              if [tuple(row[:2]) for row in pair_rows] != list(pairs):
                  raise SystemExit("The design diverges from the five owner-confirmed pairs")

              roster = rows_between("## 1. Element roster", "## Identity and lore", 6)
              if len(roster) != 10 or {row[0]: row[1] for row in roster} != opposition:
                  raise SystemExit("Base roster does not match the five reciprocal pairs")
              ids = {row[0]: row[2] for row in roster}
              if len(set(ids.values())) != 10 or ids["Earth"] != "`earth`" or "`chronos`" in ids.values():
                  raise SystemExit("The base roster must contain ten IDs with Earth and without Chronos")

              fusions = {
                  "Magma": ("Fire", "Forest"), "Tempest": ("Water", "Lightning"),
                  "Glacier": ("Frost", "Water"), "Eclipse": ("Dark", "Light"),
              }
              fusion_rows = rows_between("### Creatures and fusion lineage", "### Fusion spell reference", 6)
              recorded_recipes = {row[0]: tuple(row[1].split(" + ")) for row in fusion_rows}
              if len(fusion_rows) != len(fusions) or recorded_recipes != fusions:
                  raise SystemExit("Fusion recipes diverge from the rebuilt proposal")

              labels = list(opposition) + list(fusions)
              matrix = rows_between("### Proposed directional matrix", "### Spells, shields, and prisms", len(labels) + 1)
              matrix_header = "| Attacker | " + " | ".join(labels) + " |"
              if matrix_header not in design_text.splitlines() or [row[0] for row in matrix] != labels:
                  raise SystemExit("Matrix must include every v1 attacker and defender in order")
              prism_rows = rows_between("### Spells, shields, and prisms", "#### Earth starter kit", 3)
              if prism_rows != [
                  ["Thermal Prism", "Fire", "Frost"],
                  ["Coral Prism", "Water", "Lightning"],
                  ["Nimbus Prism", "Lightning", "Water"],
              ]:
                  raise SystemExit("Existing prism destinations must be specified explicitly")

              for attacker, *values in matrix:
                  for defender, actual in zip(labels, values):
                      if attacker == defender:
                          expected = "0.85"
                      elif opposition.get(attacker) == defender:
                          expected = "1.25"
                      elif any(opposition[parent] == defender for parent in fusions.get(attacker, ())):
                          expected = "1.15"
                      else:
                          expected = "1.00"
                      if actual != expected:
                          raise SystemExit(f"{attacker} -> {defender}: expected {expected}, got {actual}")

              outside_schema = {"Time", "Space", "Chronos", "Aetheris"}
              if outside_schema.intersection(labels):
                  raise SystemExit("Time, Space, and their prototype entries belong outside the matrix")
              if "Time and Space are outside the elemental system." not in design_text:
                  raise SystemExit("The specification must state the owner-confirmed element boundary")

              lore = rows_between("### Why are there five opposing pairs?", "### Are the elements conscious?", 2)
              if [row[0] for row in lore] != [f"{a} ↔ {b}" for a, b in pairs]:
                  raise SystemExit("Mythology must use the five confirmed oppositions")

              coverage = (
                  ("### Palette, emblem, and UI icon", "### Magic, creatures, and environments", 6, labels),
                  ("### Magic, creatures, and environments", "### Readability and art review", 4, labels),
                  ("### Habitats of the Ten", "### Where habitats overlap", 4, list(opposition)),
                  ("### Fusion contact zones", "## 8. Existing game compatibility", 3, list(fusions)),
                  ("### Compatibility audit", "### Rollout and rollback", 3,
                   ["**Spells**", "**Creatures**", "**Combat calculations**", "**Fusion recipes**",
                    "**Saves**", "**Progression**"]),
              )
              for first, last, columns, names in coverage:
                  table_rows = rows_between(first, last, columns)
                  if len(table_rows) != len(names) or {row[0] for row in table_rows} != set(names):
                      raise SystemExit(f"Incorrect coverage under {first}")

              habitat_fusions = rows_between("### Fusion contact zones", "## 8. Existing game compatibility", 3)
              if {row[0]: tuple(row[1].split(" + ")) for row in habitat_fusions} != fusions:
                  raise SystemExit("Habitat parent pairs must match fusion recipes")

          print(f"Verified Element HQ documents at {head}")
          PY
