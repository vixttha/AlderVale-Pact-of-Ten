name: Element HQ documents

on:
  push:
    branches: [element-hq-v1]
  pull_request:
    branches: [element-hq-v1]

permissions:
  contents: read

concurrency:
  group: element-hq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Verify Element HQ checkout
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check branch contents, template, and design
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          head = git("rev-parse", "HEAD").strip()
          if head != os.environ["GITHUB_SHA"]:
              raise SystemExit(f"Unexpected checkout: {head}")

          workflow = ".github/workflows/element-hq.yml"
          template = "element-hq/templates/element-design.md"
          design = "element-hq/designs/aldervale-element-system-v1.md"
          documents = {
              "element-hq/README.md",
              "element-hq/element-registry.md",
              "element-hq/fusion-system-v1.md",
              template,
              design,
              "element-hq/fusions/README.md",
              "element-hq/FUSION_QUALITY_LAW.md",
              "element-hq/designs/fusion-system-revamp-proposal.md",
              "element-hq/designs/fusion-system-mind-map.md",
              "element-hq/designs/ui-audits/skill-web-visual-audit-2026-11-18.md",
              "element-hq/designs/ui-audits/focused-water-v2-visual-audit-2026-11-18.md",
          }
          tracked = set(git("ls-files", "-z").rstrip("\0").split("\0"))
          missing = (documents | {"README.md", workflow, "element-hq/fusions/build_atlas.py"}) - tracked
          unexpected = {
              path for path in tracked
              if path not in {"README.md", workflow, "element-hq/fusions/build_atlas.py"}
              and (not path.startswith("element-hq/") or not path.endswith(".md")
                   or not Path(path).is_file() or Path(path).is_symlink())
          }
          if missing or unexpected:
              raise SystemExit(f"Missing: {sorted(missing)}; unexpected: {sorted(unexpected)}")

          guide = Path("README.md").read_text(encoding="utf-8")
          for path in sorted(documents):
              if f"]({path})" not in guide:
                  raise SystemExit(f"Branch guide is missing its link to {path}")

          sections = {
              "## Identity and lore",
              "## Current mechanics and sources",
              "## Proposed mechanics",
              "## Creatures and fusion lineage",
              "## Balance and verification",
              "## Open questions and decisions",
          }
          for path in (template, design):
              headings = set(Path(path).read_text(encoding="utf-8").splitlines())
              if missing_sections := sections - headings:
                  raise SystemExit(f"{path} is missing sections: {sorted(missing_sections)}")

          law = Path("element-hq/FUSION_QUALITY_LAW.md").read_text(encoding="utf-8")
          required_law = (
              "No fusion may become playable unless it has a strong explanation for both parent elements",
              "a distinctive visual identity, a unique combat purpose, and meaningful counterplay.",
              "Q1: Both parents make sense", "Q2: Distinct visual identity",
              "Q3: Unique combat purpose", "Q4: Meaningful counterplay",
              "Any FAIL or UNVERIFIED blocks promotion to playable.",
              "Ten permanent base elemental schools",
          )
          for clause in required_law:
              if clause not in law:
                  raise SystemExit(f"FQ-001 law missing required clause: {clause}")
          # Screenshot audit is a source-bound *design* record, not a pixel/layout test.
          screenshot_audit = Path("element-hq/designs/ui-audits/skill-web-visual-audit-2026-11-18.md").read_text(encoding="utf-8")
          checks = (
              "Level 12 → Rank 6",
              "6 / 10 used",
              "SW-01", "SW-02", "SW-03", "SW-04",
              "FQ-001", "UNVERIFIED", "90",
              "not uploaded to a public repository",
          )
          if missing_audit := [label for label in checks if label.lower() not in screenshot_audit.lower()]:
              raise SystemExit(f"Screenshot audit omissions: {missing_audit}")
          # Guard the optional even-level point model without mislabeling it implemented.
          assert (12 + 1) // 2 == 6  # live rank formula at level 12
          assert len(range(2, 13, 2)) == 6  # *proposed* mastery-point schedule
          revised_audit = Path("element-hq/designs/ui-audits/focused-water-v2-visual-audit-2026-11-18.md").read_text(encoding="utf-8")
          revised_required = ("WF2-01", "WF2-02", "WF2-03", "WF2-04",
                             "6 earned", "4 spent", "2 available", "FQ-001",
                             "static image", "six small green")
          if missing := [part for part in revised_required if part.lower() not in revised_audit.lower()]:
              raise SystemExit(f"Second screenshot audit missing required evidence: {missing}")
          print("Verified second Water screenshot audit document and illustrative point math; no pixel/DOM test")
          print("Verified screenshot audit checklist + conditional level-12 arithmetic; no image pixels tested")
          print("Verified FQ-001: all four owner-required quality gates")
          foundation = "element-hq/designs/element-foundation-confirmation-2026-11-24.md"
          if foundation in tracked:
              if f"]({foundation})" not in guide:
                  raise SystemExit("Foundation is not indexed")
              proposal = Path(foundation).read_text(encoding="utf-8")
              for clause in ("Owner-approved — LOCKED (EA-001)",
                             "All ten elements selectable at character creation.",
                             "Additional elements discovered through exploration and trials.",
                             "Advanced power earned through mastery.",
                             "Potentially all ten schools learnable, with two equipped affinities at a time.",
                             "Fusion techniques earned separately.",
                             "single primary affinity", "FQ-001", "No gameplay changes until authorized"):
                  if clause not in proposal:
                      raise SystemExit(f"Foundation decision boundary missing: {clause}")
          combat = "element-hq/designs/combat-identities-and-hybrid-extension-v1.md"
          if combat in tracked:
              assert f"]({combat})" in guide, "Combat design not indexed"
              rows = [line.strip("|").split("|") for line in Path(combat).read_text(encoding="utf-8").splitlines() if line.startswith("| ")]
              schools = {"Fire", "Water", "Lightning", "Frost", "Wind", "Earth", "Light", "Dark", "Metal", "Plant"}
              school_rows = [[cell.strip() for cell in row] for row in rows if row[0].strip() in schools]
              assert len(school_rows) == 10 and {row[0] for row in school_rows} == schools
              assert all(len(row) == 9 and all(row) for row in school_rows)
              assert len({row[1] for row in school_rows}) == len({row[2] for row in school_rows}) == 10
              assert len({name for row in school_rows for name in row[5:9]}) == 40
              hybrid_rows = {row[0].strip(): row[1].strip() for row in rows if row[0].strip() in {"Rust", "Sugar", "Magnetism"}}
              assert hybrid_rows == {"Rust": "Water + Metal", "Sugar": "Light + Plant", "Magnetism": "Earth + Metal"}
              print("Verified design table: 10 schools, 40 distinct ability concepts, three selected recipes (document structure only)")
              doc = Path(combat).read_text(encoding="utf-8")
              region_text = doc.split("### Ten elemental territories (working names)", 1)[1].split("### Creature ontology", 1)[0]
              region_rows = [[cell.strip() for cell in line.strip("|").split("|")] for line in region_text.splitlines() if line.startswith("| ")][1:]
              assert len(region_rows) == 10 and all(len(row) == 5 and all(row) for row in region_rows)
              assert {row[1] for row in region_rows} == schools and len({row[0] for row in region_rows}) == 10
              types_text = doc.split("### Creature ontology and bond system", 1)[1].split("### Prototype and audit order", 1)[0]
              types_rows = [[cell.strip() for cell in line.strip("|").split("|")] for line in types_text.splitlines() if line.startswith("| ")][1:]
              assert len(types_rows) == 6 and {row[0] for row in types_rows} == {"Wildlife", "Magical beast", "Elemental", "Spirit", "Construct", "Divine being"}
              assert all(len(row) == 3 and all(row) for row in types_rows)
              assert "6 earned, 4 spent, 2 available" in doc and "maximum two distinct equipped" in doc
              print("Verified territory and creature classification design coverage (not gameplay or balance)")
          print(f"Verified Element HQ documents at {head}")
          PY
      - name: Verify Fusion Name Atlas
        run: python3 element-hq/fusions/build_atlas.py --check
