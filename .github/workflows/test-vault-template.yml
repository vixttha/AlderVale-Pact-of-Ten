name: Test Vault v0.0.2 adoption

on:
  pull_request:
    paths:
      - '.github/workflows/test-vault-template.yml'
      - 'docs/test-vault/**'
      - 'tests/vault/first_playable_reference.py'
      - 'tests/vault/quest_catalog.rb'
      - 'tests/vault/rust/**'
      - 'tests/vault/cpp/**'
      - 'tests/vault/csharp/**'
      - 'tests/vault/fsharp/**'
      - 'shared/**'
      - 'src/lib/storage.ts'
      - 'src/lib/firebase.ts'
      - 'src/engine/campusCollision.ts'
      - 'tests/vault/lua/**'
      - 'public/models/**.glb'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-vault-template.yml'
      - 'docs/test-vault/**'
      - 'tests/vault/first_playable_reference.py'
      - 'tests/vault/quest_catalog.rb'
      - 'tests/vault/rust/**'
      - 'tests/vault/cpp/**'
      - 'tests/vault/csharp/**'
      - 'tests/vault/fsharp/**'
      - 'shared/**'
      - 'src/lib/storage.ts'
      - 'src/lib/firebase.ts'
      - 'src/engine/campusCollision.ts'
      - 'tests/vault/lua/**'
      - 'public/models/**.glb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-template-adoption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adoption:
    name: Vault adoption (${{ matrix.fixture }})
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        fixture: [python-cli, go-api, docs-only]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.fixture == 'go-api'
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify copy-in adoption
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          {
            printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)"
            printf 'Base: %s\nHead: %s\n' "${BASE:-n/a}" "${HEAD:-n/a}"
            printf 'Run / attempt: %s / %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            python3 docs/test-vault/public-template/verify_adoption.py --fixture "$FIXTURE"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
  aldervale-catalog:
    name: Vault AlderVale catalog
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Validate AlderVale topics
        shell: bash
        run: |
          set -o pipefail
          printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 docs/test-vault/public-template/verify_adoption.py --aldervale-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 docs/test-vault/public-template/starter/test-vault/validate_catalog.py \
            --catalog docs/test-vault/aldervale/cases.md 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          global-json-file: tests/vault/csharp/global.json
      - name: Verify guest save v1 contracts with C sharp
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -eo pipefail
          fixture_dir="$RUNNER_TEMP/aldervale-csharp-saves"
          (
            set -e
            printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)"
            printf 'Base: %s\nHead: %s\n' "${BASE:-n/a}" "${HEAD:-n/a}"
            printf 'Run / attempt: %s / %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            node --version
            node tests/vault/csharp/export-guest-saves.mjs "$fixture_dir"
            cd tests/vault/csharp
            dotnet --version
            dotnet restore GuestSaveContracts.csproj --configfile NuGet.Config
            dotnet run --project GuestSaveContracts.csproj --configuration Release --no-restore -- "$fixture_dir"
          ) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare saga sequences with the F sharp model
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -eo pipefail
          (
            set -e
            printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)"
            printf 'Base: %s\nHead: %s\nRun / attempt: %s / %s\n' "${PR_BASE_SHA:-n/a}" "${PR_HEAD_SHA:-n/a}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            node --version
            cd tests/vault/fsharp
            dotnet --version
            dotnet fsi --exec quest-contracts.fsx
          ) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare game rules with the Python reference
        shell: bash
        run: |
          set -o pipefail
          python3 tests/vault/first_playable_reference.py -v 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the quest catalog with Ruby
        shell: bash
        run: |
          set -o pipefail
          ruby --version
          ruby tests/vault/quest_catalog.rb 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify embedded GLB asset contracts with Rust
        shell: bash
        run: |
          set -eo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version | tee -a "$GITHUB_STEP_SUMMARY"
          cargo +1.95.0 test --locked --manifest-path tests/vault/rust/Cargo.toml 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check C++ combat and guest-save contracts
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          build_dir="$RUNNER_TEMP/aldervale-cpp-vault"
          (
            set -e
            printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)"
            printf 'Base: %s\nHead: %s\n' "${BASE:-n/a}" "${HEAD:-n/a}"
            printf 'Run / attempt: %s / %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            node --version
            cmake --version
            c++ --version
            cmake -S tests/vault/cpp -B "$build_dir"
            cmake --build "$build_dir" --parallel 2
            node tests/vault/cpp/export-observations.mjs > "$build_dir/observed-v1.tsv"
            ctest --test-dir "$build_dir" --output-on-failure --verbose
          ) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare campus movement with Lua fixtures
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/lua-movement.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          {
            printf 'Tested checkout: %s\n' "$(git rev-parse HEAD)"
            printf 'Base: %s\nHead: %s\nRun / attempt: %s / %s\n' "${BASE:-n/a}" "${HEAD:-n/a}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30 \
              --output "$work/lua-5.4.8.tar.gz" https://www.lua.org/ftp/lua-5.4.8.tar.gz
            printf '%s  %s\n' '4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae' \
              "$work/lua-5.4.8.tar.gz" | sha256sum --check --status
            tar -xzf "$work/lua-5.4.8.tar.gz" -C "$work"
            make -s -j2 -C "$work/lua-5.4.8" linux
            lua="$work/lua-5.4.8/src/lua"
            "$lua" -v
            "$lua" tests/vault/lua/movement-contracts.lua fixtures > "$work/fixtures.tsv"
            node tests/vault/lua/observe-movement.mjs "$work/fixtures.tsv" > "$work/observed.tsv"
            "$lua" tests/vault/lua/movement-contracts.lua verify "$work/observed.tsv"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
