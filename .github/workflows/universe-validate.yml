name: Universe HQ documents
on:
  push:
    branches: [universe-hq]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universe-hq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/validate_universe.py
  build-and-validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install deterministic rendering dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --no-deps -r tools/open_hearth_requirements.txt
      - name: Export and validate candidate emblems
        run: python tools/export_open_hearth.py
      - name: Upload review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-hearth-five-studies
          path: dist/open-hearth/
          if-no-files-found: error
          retention-days: 1
      - name: Export Avarn anatomy studies
        run: python tools/export_avarn_concepts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avarn-five-anatomy-studies
          path: dist/avarn-concepts/
          if-no-files-found: error
          retention-days: 1
