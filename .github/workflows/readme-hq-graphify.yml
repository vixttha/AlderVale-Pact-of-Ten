name: README HQ Graphify

on:
  push:
    branches: [readme-hq]
  pull_request:
    branches: [readme-hq]
    paths:
      - '.github/workflows/readme-hq-graphify.yml'
      - 'tools/graphify/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: readme-hq-graphify-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  build:
    name: Build and query the README HQ graph
    if: github.event.repository.private == false && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      snapshot_0: ${{ steps.pack.outputs.snapshot_0 }}
      snapshot_1: ${{ steps.pack.outputs.snapshot_1 }}
      snapshot_2: ${{ steps.pack.outputs.snapshot_2 }}
      snapshot_3: ${{ steps.pack.outputs.snapshot_3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked Graphify packages
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps -r tools/graphify/requirements.txt
      - name: Index the exact README HQ checkout
        run: |
          graphify extract . --code-only --max-workers 2 --out "$RUNNER_TEMP/readme-hq"
          python tools/graphify/readme_hq_map.py build "$RUNNER_TEMP/readme-hq/graphify-out/graph.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack the verified graph and receipt
        id: pack
        run: python tools/graphify/transfer.py pack "$RUNNER_TEMP/readme-hq/graphify-out"

  readback:
    name: Verify the transferred graph and destination
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked Graphify packages
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps -r tools/graphify/requirements.txt
      - name: Verify provenance and query the transferred map over MCP
        env:
          SNAPSHOT_0: ${{ needs.build.outputs.snapshot_0 }}
          SNAPSHOT_1: ${{ needs.build.outputs.snapshot_1 }}
          SNAPSHOT_2: ${{ needs.build.outputs.snapshot_2 }}
          SNAPSHOT_3: ${{ needs.build.outputs.snapshot_3 }}
        run: |
          python tools/graphify/transfer.py unpack "$RUNNER_TEMP/snapshot"
          python tools/graphify/readme_hq_map.py readback "$RUNNER_TEMP/snapshot/graph.json"
      - name: Exercise the publisher with an isolated Git remote
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          git init -q --bare "$fixture/remote.git"
          git clone -q --no-hardlinks . "$fixture/source"
          git -C "$fixture/source" remote set-url origin "$fixture/remote.git"
          git -C "$fixture/source" push -q origin HEAD:refs/heads/readme-hq
          (
            cd "$fixture/source"
            GITHUB_REF=refs/heads/readme-hq bash "$GITHUB_WORKSPACE/tools/graphify/publish.sh" "$RUNNER_TEMP/snapshot"
          )
          git --git-dir="$fixture/remote.git" show graphify-snapshots:readme-hq/graph.json | cmp "$RUNNER_TEMP/snapshot/graph.json" -
          git --git-dir="$fixture/remote.git" show graphify-snapshots:readme-hq/receipt.json | cmp "$RUNNER_TEMP/snapshot/receipt.json" -
          test "$(git --git-dir="$fixture/remote.git" ls-tree --name-only graphify-snapshots)" = readme-hq

  publish:
    name: Publish the verified README HQ graph
    if: github.event.repository.private == false && github.ref == 'refs/heads/readme-hq'
    needs: [build, readback]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the verified graph and receipt
        env:
          SNAPSHOT_0: ${{ needs.build.outputs.snapshot_0 }}
          SNAPSHOT_1: ${{ needs.build.outputs.snapshot_1 }}
          SNAPSHOT_2: ${{ needs.build.outputs.snapshot_2 }}
          SNAPSHOT_3: ${{ needs.build.outputs.snapshot_3 }}
        run: python3 tools/graphify/transfer.py unpack "$RUNNER_TEMP/snapshot"
      - name: Publish only the current README HQ snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/graphify/publish.sh "$RUNNER_TEMP/snapshot"
